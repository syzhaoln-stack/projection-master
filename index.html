<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工图投影大师 - 三维与三视图教学工具</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#101723;
  --panel:#172233;
  --panel-2:#1d2d3f;
  --line:rgba(255,255,255,.12);
  --text:#edf5f8;
  --muted:#94a8b7;
  --cyan:#62d7e8;
  --amber:#f2b84b;
  --green:#83d17b;
  --coral:#f07864;
}
body{
  height:100vh;
  overflow:hidden;
  display:flex;
  color:var(--text);
  background:radial-gradient(circle at 74% 18%,rgba(98,215,232,.18),transparent 30%),
    linear-gradient(135deg,#101723 0%,#172033 52%,#111821 100%);
  font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;
}
#left-panel{
  width:306px;
  min-width:306px;
  height:100vh;
  padding:18px 16px;
  display:flex;
  flex-direction:column;
  gap:14px;
  overflow-y:auto;
  background:rgba(18,28,42,.92);
  border-right:1px solid var(--line);
  box-shadow:18px 0 42px rgba(0,0,0,.25);
  z-index:10;
}
#left-panel h1{
  font-size:20px;
  line-height:1.2;
  letter-spacing:0;
  color:#f6fbff;
}
#left-panel h1 span{
  display:block;
  margin-top:5px;
  color:var(--cyan);
  font-size:11px;
  font-weight:500;
}
.panel-section{
  padding:13px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.045);
}
.panel-section h3{
  margin-bottom:10px;
  color:#cfe9f0;
  font-size:12px;
  letter-spacing:.08em;
}
.model-grid{display:grid;grid-template-columns:1fr;gap:7px}
.model-btn{
  width:100%;
  min-height:36px;
  padding:8px 10px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:7px;
  background:rgba(255,255,255,.045);
  color:#d9e5eb;
  font-size:13px;
  text-align:left;
  cursor:pointer;
  transition:background .18s,border-color .18s,color .18s,transform .18s;
}
.model-btn:hover{transform:translateX(2px);background:rgba(98,215,232,.09);border-color:rgba(98,215,232,.42)}
.model-btn.active{background:rgba(98,215,232,.16);border-color:var(--cyan);color:#f6feff}
.model-btn small{display:block;margin-top:2px;color:#8fa6b5;font-size:11px}
.slider-group{margin:11px 0}
.slider-group label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:#b8c8d3;font-size:12px}
.slider-group label span{color:var(--cyan);font-weight:700}
input[type=range]{
  width:100%;
  height:5px;
  border-radius:999px;
  outline:none;
  -webkit-appearance:none;
  background:linear-gradient(90deg,rgba(98,215,232,.45),rgba(242,184,75,.35));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:15px;
  height:15px;
  border-radius:50%;
  background:#f9fdff;
  border:3px solid var(--cyan);
  cursor:pointer;
  box-shadow:0 2px 10px rgba(98,215,232,.42);
}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0}
.toggle-row span{color:#c6d4dd;font-size:12px}
.toggle{
  width:38px;
  height:22px;
  padding:3px;
  border-radius:999px;
  background:#314052;
  cursor:pointer;
  transition:background .2s;
}
.toggle::after{
  content:"";
  display:block;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#edf5f8;
  transition:transform .2s;
}
.toggle.on{background:var(--cyan)}
.toggle.on::after{transform:translateX(16px)}
#unfold-btn{
  width:100%;
  min-height:38px;
  margin:3px 0 7px;
  border:0;
  border-radius:7px;
  background:linear-gradient(135deg,var(--cyan),var(--amber));
  color:#10202a;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 10px 26px rgba(0,0,0,.25);
  transition:transform .16s,filter .16s;
}
#unfold-btn:hover{transform:translateY(-1px);filter:saturate(1.08)}
#unfold-btn:active{transform:translateY(0)}
.import-btn{
  width:100%;
  min-height:36px;
  border:1px solid rgba(98,215,232,.42);
  border-radius:7px;
  background:rgba(98,215,232,.1);
  color:#e8fbff;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  transition:background .18s,border-color .18s,transform .18s;
}
.import-btn:hover{transform:translateY(-1px);background:rgba(98,215,232,.16);border-color:var(--cyan)}
#obj-file{display:none}
.import-status{
  margin-top:8px;
  color:#94a8b7;
  font-size:11px;
  line-height:1.55;
}
.import-status strong{color:#62d7e8;font-weight:700}
.info-box{
  padding:10px;
  border-left:3px solid var(--amber);
  border-radius:7px;
  background:rgba(0,0,0,.18);
  color:#9fb0bc;
  font-size:11px;
  line-height:1.65;
}
.info-box b{color:#eaf3f7}
.info-box kbd{
  display:inline-block;
  min-width:38px;
  margin-right:4px;
  padding:1px 5px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:4px;
  background:rgba(255,255,255,.08);
  color:#dce8ee;
  font-size:10px;
  text-align:center;
}
#viewport{flex:1;position:relative;min-width:0}
#viewport canvas{display:block;width:100%;height:100%}
#view-label{
  position:absolute;
  top:16px;
  right:18px;
  padding:7px 11px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:7px;
  background:rgba(18,28,42,.78);
  color:#d8f8ff;
  font-size:12px;
  pointer-events:none;
  backdrop-filter:blur(10px);
}
#status-strip{
  position:absolute;
  left:18px;
  bottom:16px;
  max-width:min(560px,calc(100vw - 360px));
  padding:8px 12px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:7px;
  background:rgba(18,28,42,.72);
  color:#cad8df;
  font-size:12px;
  pointer-events:none;
  backdrop-filter:blur(10px);
}
#mobile-unfold-fab{
  display:none;
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  z-index:7;
  min-width:168px;
  min-height:44px;
  padding:0 18px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:999px;
  background:linear-gradient(135deg,var(--cyan),var(--amber));
  color:#10202a;
  font-size:14px;
  font-weight:800;
  box-shadow:0 14px 32px rgba(0,0,0,.34);
  cursor:pointer;
}
#mobile-unfold-fab:active{transform:translateX(-50%) scale(.98)}
@media (max-width:760px){
  body{flex-direction:column}
  #left-panel{width:100%;min-width:0;height:auto;max-height:46vh;border-right:0;border-bottom:1px solid var(--line)}
  #viewport{height:54vh}
  #status-strip{left:12px;right:12px;bottom:72px;max-width:none}
  #mobile-unfold-fab{display:block}
}
</style>
</head>
<body>
<aside id="left-panel">
  <header>
    <h1>工图投影大师<span>Engineering Drawing 3D Projection</span></h1>
  </header>

  <section class="panel-section">
    <h3>选择模型</h3>
    <div class="model-grid">
      <button class="model-btn active" data-model="step">叠加台阶块<small>三层叠加，训练长对正</small></button>
      <button class="model-btn" data-model="slottedBlock">开槽垫块<small>矩形槽、内轮廓和虚线</small></button>
      <button class="model-btn" data-model="notchedBlock">缺口切割块<small>局部切除与投影对应</small></button>
      <button class="model-btn" data-model="ribBracket">肋板支架<small>底板、立板、三角肋板</small></button>
      <button class="model-btn" data-model="bearingSeat">轴承座<small>底板、支承板、肋板、圆柱筒</small></button>
      <button class="model-btn" data-model="dovetailSlide">燕尾槽滑块<small>斜面槽与滑块结构</small></button>
      <button class="model-btn" data-model="vBlock">V 形定位块<small>V 槽定位面与对称投影</small></button>
      <button class="model-btn" data-model="compoundSeat">综合支座<small>凸台、槽口、圆柱混合</small></button>
    </div>
  </section>

  <section class="panel-section">
    <h3>导入模型</h3>
    <input type="file" id="obj-file" accept=".obj,text/plain">
    <button class="import-btn" id="obj-import-btn">导入 OBJ 文件</button>
    <div class="import-status" id="obj-status">支持本地 OBJ 网格；导入后会自动居中、缩放并生成三视图。</div>
  </section>

  <section class="panel-section">
    <h3>投影控制</h3>
    <button id="unfold-btn" aria-pressed="false">展开三视图</button>
    <div class="toggle-row"><span>显示投影连线</span><div class="toggle on" id="tog-projlines"></div></div>
    <div class="toggle-row"><span>显示虚线与中心线</span><div class="toggle on" id="tog-hidden"></div></div>
    <div class="toggle-row"><span>显示坐标轴</span><div class="toggle on" id="tog-axes"></div></div>
    <div class="toggle-row"><span>半透明模型</span><div class="toggle" id="tog-transparent"></div></div>
  </section>

  <section class="panel-section">
    <h3>显示设置</h3>
    <div class="slider-group">
      <label>投影面透明度 <span id="plane-alpha-val">0.16</span></label>
      <input type="range" id="plane-alpha" min="6" max="42" value="16">
    </div>
    <div class="slider-group">
      <label>投影面尺寸 <span id="plane-size-val">7.5</span></label>
      <input type="range" id="plane-size" min="6" max="11" step="0.5" value="7.5">
    </div>
    <div class="slider-group">
      <label>模型离底面距离 <span id="plane-gap-val">1.4</span></label>
      <input type="range" id="plane-gap" min="0.4" max="2.2" step="0.1" value="1.4">
    </div>
  </section>

  <div class="info-box">
    <b>操作提示：</b><br>
    <kbd>左键</kbd>旋转视角<br>
    <kbd>滚轮</kbd>缩放<br>
    <kbd>右键</kbd>平移<br>
    <kbd>空格</kbd>展开或合并三视图<br>
    第一角投影法：长对正、宽相等、高平齐
  </div>
</aside>

<main id="viewport">
  <div id="view-label">三维透视 · 第一角投影</div>
  <div id="status-strip">H 水平投影面已下移，模型底面与底面投影之间保留清晰距离。</div>
  <button id="mobile-unfold-fab" aria-pressed="false">展开三视图</button>
</main>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module" src="projection-master.js"></script>
</body>
</html>
